# yaml-language-server: $schema=https://api.kestra.io/v1/plugins/schemas/flow
id: content-pipeline
namespace: vid2tweet
variables:
  python_image: "python:3.11-slim"
  max_tweet_chars: 280
inputs:
  # Canonical input definitions — subflows mirror these; keep descriptions in sync.
  - id: youtube_url
    type: STRING
    description: "YouTube video URL to process (e.g. https://youtu.be/abc123)"
  - id: youtube_cookies
    type: STRING
    description: "Raw contents of a YouTube cookies.txt file (Netscape format) used to bypass age/login restrictions."
  - id: dry_run
    type: BOOLEAN
    description: "If true, skip actual Twitter posting (use when Twitter API lacks write access)"
    defaults: false
  - id: twitter_oauth2_token
    type: STRING
    required: false
    description: "OAuth 2.0 user access token from Connect X flow (injected server-side by the frontend)"

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    message: "content-pipeline failed for {{ inputs.youtube_url }} (execution {{ execution.id }})"

tasks:
  - id: prepare_assets
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: fetch_thumbnail
        type: io.kestra.plugin.core.flow.Subflow
        namespace: vid2tweet
        flowId: extract-image
        inputs:
          youtube_url: "{{ inputs.youtube_url }}"
        wait: true
        transmitFailed: true

      - id: download_audio
        type: io.kestra.plugin.core.flow.Subflow
        namespace: vid2tweet
        flowId: download-audio
        inputs:
          youtube_url: "{{ inputs.youtube_url }}"
          youtube_cookies: "{{ inputs.youtube_cookies }}"
        wait: true
        transmitFailed: true

  - id: transcribe_audio
    type: io.kestra.plugin.core.flow.Subflow
    namespace: vid2tweet
    flowId: transcribe-audio
    inputs:
      audio_file_uri: "{{ outputs.download_audio.outputs.audio_file_uri }}"
    wait: true
    transmitFailed: true

  - id: generate_tweet
    type: io.kestra.plugin.core.flow.Subflow
    namespace: vid2tweet
    flowId: generate-tweet
    inputs:
      transcript: "{{ outputs.transcribe_audio.outputs.transcript_text }}"
    wait: true
    transmitFailed: true

  - id: human_approval
    type: io.kestra.plugin.core.flow.Pause
    pauseDuration: PT24H
    behavior: FAIL
    onResume:
      - id: approved
        type: BOOLEAN
        description: "Approve tweet for posting?"
      - id: edited_tweet
        type: STRING
        required: false
        description: "Optionally edit the tweet text before posting"

  - id: check_approval
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.human_approval.onResume.approved }}"
    then:
      - id: resolve_final_tweet
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: "{{ vars.python_image }}"
        inputFiles:
          tweet.txt: "{{ outputs.generate_tweet.outputs.tweet_file_uri }}"
        env:
          EDITED_TWEET: "{{ outputs.human_approval.onResume.edited_tweet }}"
        commands:
          - |
            set -e
            if [ -n "${EDITED_TWEET:-}" ]; then
              printf "%s" "$EDITED_TWEET" > final_tweet.txt
            else
              cp tweet.txt final_tweet.txt
            fi
            TWEET_LEN=$(wc -m < final_tweet.txt | tr -d ' ')
            echo "Final tweet length: $TWEET_LEN characters"
            if [ "$TWEET_LEN" -gt {{ vars.max_tweet_chars }} ]; then
              echo "ERROR: Final tweet exceeds {{ vars.max_tweet_chars }} characters ($TWEET_LEN)" >&2
              exit 1
            fi
        outputFiles:
          - final_tweet.txt

      - id: post_tweet
        type: io.kestra.plugin.core.flow.Subflow
        namespace: vid2tweet
        flowId: post-tweet
        inputs:
          tweet_text: "{{ read(outputs.resolve_final_tweet.outputFiles['final_tweet.txt']) | trim }}"
          video_id: "{{ outputs.fetch_thumbnail.outputs.video_id }}"
          dry_run: "{{ inputs.dry_run }}"
          twitter_oauth2_token: "{{ inputs.twitter_oauth2_token }}"
        wait: true
        transmitFailed: true

      - id: save_result
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('DB_URL') }}"
        username: "{{ secret('DB_USER') }}"
        password: "{{ secret('DB_PASSWORD') }}"
        sql: |
          INSERT INTO pipeline_results (youtube_url, tweet_text, tweet_id, status, created_at)
          VALUES (
            '{{ inputs.youtube_url }}',
            '{{ outputs.post_tweet.outputs.tweet_text }}',
            '{{ outputs.post_tweet.outputs.tweet_id }}',
            'POSTED',
            NOW()
          );
    else:
      - id: resolve_rejected_tweet
        type: io.kestra.plugin.scripts.shell.Commands
        containerImage: "{{ vars.python_image }}"
        inputFiles:
          tweet.txt: "{{ outputs.generate_tweet.outputs.tweet_file_uri }}"
        env:
          EDITED_TWEET: "{{ outputs.human_approval.onResume.edited_tweet }}"
        commands:
          - |
            set -e
            if [ -n "${EDITED_TWEET:-}" ]; then
              printf "%s" "$EDITED_TWEET" > final_tweet.txt
            else
              cp tweet.txt final_tweet.txt
            fi
        outputFiles:
          - final_tweet.txt

      - id: save_rejection
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ secret('DB_URL') }}"
        username: "{{ secret('DB_USER') }}"
        password: "{{ secret('DB_PASSWORD') }}"
        sql: |
          INSERT INTO pipeline_results (youtube_url, tweet_text, tweet_id, status, created_at)
          VALUES (
            '{{ inputs.youtube_url }}',
            '{{ read(outputs.resolve_rejected_tweet.outputFiles["final_tweet.txt"]) }}',
            NULL,
            'REJECTED',
            NOW()
          );

      - id: rejected
        type: io.kestra.plugin.core.log.Log
        message: "Tweet rejected by user. Pipeline terminated without posting. Execution ID: {{ execution.id }}"

outputs:
  - id: generated_tweet_text
    type: STRING
    value: "{{ outputs.generate_tweet.outputs.tweet_text }}"
  - id: generated_tweet_uri
    type: URI
    value: "{{ outputs.generate_tweet.outputs.tweet_file_uri }}"
  - id: transcript_uri
    type: URI
    value: "{{ outputs.transcribe_audio.outputs.transcript_uri }}"
  - id: thumbnail_uri
    type: URI
    value: "{{ outputs.fetch_thumbnail.outputs.thumbnail_uri }}"
  - id: video_id
    type: STRING
    value: "{{ outputs.fetch_thumbnail.outputs.video_id }}"
