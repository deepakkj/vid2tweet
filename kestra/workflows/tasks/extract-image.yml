# yaml-language-server: $schema=https://api.kestra.io/v1/plugins/schemas/flow
id: extract-image
namespace: vid2tweet
variables:
  thumbnail_quality: "hqdefault.jpg"
inputs:
  # Mirror of content-pipeline.yml canonical inputs — keep descriptions in sync.
  - id: youtube_url
    type: STRING
    description: "YouTube video URL to process (e.g. https://youtu.be/abc123)"

tasks:

  - id: extract_video_id
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "alpine"
    commands:
      - |
        set -e
        URL="{{ inputs.youtube_url }}"
        if echo "$URL" | grep -q "youtu.be/"; then
          VIDEO_ID=$(echo "$URL" | sed 's|.*youtu\.be/||' | sed 's|[?&].*||' | tr -d '[:space:]')
        elif echo "$URL" | grep -q "shorts/"; then
          VIDEO_ID=$(echo "$URL" | sed 's|.*shorts/||' | sed 's|[?&].*||' | tr -d '[:space:]')
        else
          VIDEO_ID=$(echo "$URL" | sed 's|.*[?&]v=||' | sed 's|[?&].*||' | tr -d '[:space:]')
        fi
        echo "$VIDEO_ID" > video_id.txt
    outputFiles:
      - video_id.txt

  - id: fetch_thumbnail
    type: io.kestra.plugin.core.http.Download
    uri: "https://img.youtube.com/vi/{{ read(outputs.extract_video_id.outputFiles['video_id.txt']) | trim }}/{{ vars.thumbnail_quality }}"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3

outputs:
  - id: video_id
    type: STRING
    value: "{{ read(outputs.extract_video_id.outputFiles['video_id.txt']) | trim }}"
  - id: thumbnail_uri
    type: URI
    value: "{{ outputs.fetch_thumbnail.uri }}"
