# yaml-language-server: $schema=https://api.kestra.io/v1/plugins/schemas/flow
id: extract-image
namespace: vid2tweet
variables:
  python_image: "python:3.11-slim"
  thumbnail_quality: "hqdefault.jpg"
inputs:
  # Mirror of content-pipeline.yml canonical inputs — keep descriptions in sync.
  - id: youtube_url
    type: STRING
    description: "YouTube video URL to process (e.g. https://youtu.be/abc123)"

tasks:
  - id: extract_video_id
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "{{ vars.python_image }}"
    commands:
      - python3 -c 'import re,sys; url="{{ inputs.youtube_url }}"; m=re.search(r"(?:v=|youtu\.be/|shorts/)([A-Za-z0-9_-]{11})", url); print(m.group(1)) if m else sys.exit(1)' > video_id.txt
    outputFiles:
      - video_id.txt

  - id: fetch_thumbnail
    type: io.kestra.plugin.core.http.Download
    uri: "https://img.youtube.com/vi/{{ read(outputs.extract_video_id.outputFiles['video_id.txt']) | trim }}/{{ vars.thumbnail_quality }}"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3

outputs:
  - id: video_id
    type: STRING
    value: "{{ read(outputs.extract_video_id.outputFiles['video_id.txt']) | trim }}"
  - id: thumbnail_uri
    type: URI
    value: "{{ outputs.fetch_thumbnail.uri }}"
