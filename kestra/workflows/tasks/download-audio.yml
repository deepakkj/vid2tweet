# yaml-language-server: $schema=https://api.kestra.io/v1/plugins/schemas/flow
id: download-audio
namespace: vid2tweet
variables:
  python_image: "python:3.11-slim"
  max_video_duration_seconds: 1200
  max_audio_size_bytes: 26214400
inputs:
  # Mirror of content-pipeline.yml canonical inputs — keep descriptions in sync.
  - id: youtube_url
    type: STRING
    description: "YouTube video URL to process (e.g. https://youtu.be/abc123)"
  - id: youtube_cookies
    type: STRING
    description: "Raw contents of a YouTube cookies.txt file (Netscape format) used to bypass age/login restrictions."

tasks:
  - id: download_and_compress
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "{{ vars.python_image }}"
    inputFiles:
      cookies.txt: "{{ inputs.youtube_cookies }}"
    beforeCommands:
      - pip install yt-dlp --quiet
      - DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -y ffmpeg --quiet
    commands:
      - |
        set -e
        echo "Downloading audio from: {{ inputs.youtube_url }}"

        # Fail fast if video exceeds duration limit (checked before download starts).
        # Output directly as MP3 with target sample rate/bitrate via postprocessor args.
        # Extract metadata (title + thumbnail URL) in the same yt-dlp call — no second network round-trip.
        yt-dlp --no-playlist --retries 5 --cookies cookies.txt \
          --extractor-args "youtube:player_client=mweb" \
          --match-filter "duration <= {{ vars.max_video_duration_seconds }}" \
          --print "%(title)s" --print "%(thumbnail)s" \
          -x --audio-format mp3 \
          --postprocessor-args "FFmpegExtractAudio:-ar 16000 -ac 1 -b:a 32k" \
          -o "audio_compressed.%(ext)s" "{{ inputs.youtube_url }}" \
          > metadata.txt || { echo "ERROR: Download failed or video exceeds 20-minute limit" >&2; touch metadata.txt; exit 1; }

        [ -f audio_compressed.mp3 ] || { echo "ERROR: audio_compressed.mp3 not found after download" >&2; exit 1; }

        FILE_SIZE=$(stat -c%s audio_compressed.mp3 2>/dev/null || stat -f%z audio_compressed.mp3)
        echo "Compressed audio size: $FILE_SIZE bytes"

        if [ "$FILE_SIZE" -gt {{ vars.max_audio_size_bytes }} ]; then
          echo "ERROR: Compressed audio exceeds 25MB limit" >&2
          exit 1
        fi

        [ -f metadata.txt ] || touch metadata.txt
        echo "Download and compression complete!"
    outputFiles:
      - audio_compressed.mp3
      - metadata.txt
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 2

outputs:
  - id: audio_file_uri
    type: URI
    value: "{{ outputs.download_and_compress.outputFiles['audio_compressed.mp3'] }}"
  - id: metadata_file_uri
    type: URI
    value: "{{ outputs.download_and_compress.outputFiles['metadata.txt'] }}"
